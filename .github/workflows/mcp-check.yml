name: mcp-check
# Full mcpcheck matrix for one server. Dispatched by agentcheck's tick; every
# cell POSTs itself back (signed) as soon as it finishes, so partial results
# render while the slower cells run. Inputs never carry secrets — anything
# sensitive comes from the signed job manifest at job_url.
on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: 'stdio spec, e.g. "npx -y @org/server" or "uvx some-server" (empty for remote)'
        required: false
        default: ""
        type: string
      server_url:
        description: "Streamable HTTP URL (empty for package specs)"
        required: false
        default: ""
        type: string
      target_id:
        description: agentcheck target id
        required: true
        type: string
      run_key:
        description: idempotency key for this run
        required: true
        type: string
      callback_url:
        description: POST /api/runner/callback (optional; artifacts are always uploaded)
        required: false
        default: ""
        type: string
      job_url:
        description: signed job manifest URL (optional)
        required: false
        default: ""
        type: string
      cells:
        description: "comma list of cell kinds: install,catalog,errors,compat,conformance"
        required: false
        default: "install,catalog,errors,compat,conformance"
        type: string
      timeout_ms:
        description: per-probe timeout in milliseconds
        required: false
        default: "90000"
        type: string

permissions:
  contents: read

env:
  MCP_PY_N: "2.1.1"
  MCP_PY_PREV: "2.0.1"

jobs:
  matrix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MCPCHECK_HOST: ${{ matrix.os }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      JOB_URL: ${{ inputs.job_url }}
      AGENTCHECK_CALLBACK_SECRET: ${{ secrets.AGENTCHECK_CALLBACK_SECRET }}
      # `runner.temp` is not available in a job-level env block — only inside steps — and
      # GitHub rejects the whole workflow at dispatch time with "Unrecognized named-value:
      # 'runner'", so this never ran at all. `github.workspace` is valid here and is just as
      # clean: it is a fresh checkout per run, which is the point of a clean-install probe.
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-clean-cache
      npm_config_yes: "true"
      # Passed as values, not as pre-joined argument strings. An unquoted expansion of a
      # joined string word-splits on spaces, and by then its embedded quotes are literal
      # characters rather than shell quoting — so a spec like `npx -y @org/server` reached
      # the probe as its first token alone, which is every stdio server there is. Each step
      # now builds its argv in bash, where quoting holds.
      SPEC: ${{ inputs.package_spec }}
      SERVER_URL: ${{ inputs.server_url }}
      TARGET_ID: ${{ inputs.target_id }}
      RUN_KEY: ${{ inputs.run_key }}
      TIMEOUT_MS: ${{ inputs.timeout_ms }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        if: ${{ startsWith(inputs.package_spec, 'uvx') || contains(inputs.cells, 'compat') }}
      - name: Install runner deps (clean cache)
        run: npm ci --no-audit --no-fund
        shell: bash

      - name: install + catalog
        if: ${{ contains(inputs.cells, 'install') || contains(inputs.cells, 'catalog') }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$SERVER_URL" ]; then set -- --url "$SERVER_URL"; else set -- --spec "$SPEC"; fi
          set -- "$@" --out out --target-id "$TARGET_ID" --run-key "$RUN_KEY" --timeout "$TIMEOUT_MS"
          node scripts/probe.mjs "$@"

      - name: errors (ubuntu only)
        if: ${{ contains(inputs.cells, 'errors') && matrix.os == 'ubuntu-latest' }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$SERVER_URL" ]; then set -- --url "$SERVER_URL"; else set -- --spec "$SPEC"; fi
          set -- "$@" --out out --target-id "$TARGET_ID" --run-key "$RUN_KEY" --timeout "$TIMEOUT_MS"
          node scripts/errors.mjs "$@"

      - name: compat ts-sdk N
        if: ${{ contains(inputs.cells, 'compat') }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$SERVER_URL" ]; then set -- --url "$SERVER_URL"; else set -- --spec "$SPEC"; fi
          set -- "$@" --out out --target-id "$TARGET_ID" --run-key "$RUN_KEY" --timeout "$TIMEOUT_MS"
          node scripts/compat-ts.mjs "$@"  --slot N
      - name: compat ts-sdk N-1
        if: ${{ contains(inputs.cells, 'compat') }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$SERVER_URL" ]; then set -- --url "$SERVER_URL"; else set -- --spec "$SPEC"; fi
          set -- "$@" --out out --target-id "$TARGET_ID" --run-key "$RUN_KEY" --timeout "$TIMEOUT_MS"
          node scripts/compat-ts.mjs "$@"  --slot N-1
      - name: compat py-sdk N
        if: ${{ contains(inputs.cells, 'compat') }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$SERVER_URL" ]; then set -- --url "$SERVER_URL"; else set -- --spec "$SPEC"; fi
          set -- "$@" --out out --target-id "$TARGET_ID" --run-key "$RUN_KEY" --timeout "$TIMEOUT_MS"
          node scripts/compat-py.mjs "$@"  --slot N --mcp-version $MCP_PY_N
      - name: compat py-sdk N-1
        if: ${{ contains(inputs.cells, 'compat') }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$SERVER_URL" ]; then set -- --url "$SERVER_URL"; else set -- --spec "$SPEC"; fi
          set -- "$@" --out out --target-id "$TARGET_ID" --run-key "$RUN_KEY" --timeout "$TIMEOUT_MS"
          node scripts/compat-py.mjs "$@"  --slot N-1 --mcp-version $MCP_PY_PREV

      # `claude mcp list` health-checks the server with a real initialize and
      # spends no tokens, so this cell needs no ANTHROPIC_API_KEY.
      - name: compat claude-cli (ubuntu only)
        if: ${{ contains(inputs.cells, 'compat') && matrix.os == 'ubuntu-latest' }}
        continue-on-error: true
        shell: bash
        run: |
          npm i -g @anthropic-ai/claude-code >/dev/null 2>&1 || true
          if [ -n "$SERVER_URL" ]; then set -- --url "$SERVER_URL"; else set -- --spec "$SPEC"; fi
          set -- "$@" --out out --target-id "$TARGET_ID" --run-key "$RUN_KEY" --timeout "$TIMEOUT_MS"
          node scripts/compat-claude.mjs "$@" --catalog "$(ls out/catalog_*.json 2>/dev/null | head -1)"

      - name: conformance (remote, ubuntu only)
        if: ${{ contains(inputs.cells, 'conformance') && inputs.server_url != '' && matrix.os == 'ubuntu-latest' }}
        continue-on-error: true
        shell: bash
        run: |
          node scripts/conformance.mjs --url "$SERVER_URL" --out out \
            --target-id "$TARGET_ID" --run-key "$RUN_KEY" --timeout "$TIMEOUT_MS"

      - uses: actions/upload-artifact@v4
        with:
          name: cells-${{ matrix.os }}
          path: out/*.json
          if-no-files-found: warn
